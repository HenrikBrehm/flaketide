[package]
name = "flaketide"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Henrik Brehm <qvp1@web.de>"]
description = "Cross-framework flaky-test intelligence CLI"
homepage = "https://github.com/HenrikBrehm/flaketide"
repository = "https://github.com/HenrikBrehm/flaketide"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["testing", "flaky", "ci", "cli", "tui"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = [".github/", "fixtures/", "tests/", "*.png", "*.gif"]

[[bin]]
name = "flaketide"
path = "src/main.rs"

[lib]
name = "flaketide"
path = "src/lib.rs"

[features]
default = []
live_api = []

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.2"
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "fs", "signal"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
rusqlite_migration = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
statrs = "0.17"
quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "5"
humantime = "2"
comfy-table = "7"
chrono = { version = "0.4", features = ["serde"] }
shell-words = "1"
which = "6"
blake3 = "1"
async-trait = "0.1"
tempfile = "3"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1.40", features = ["json", "yaml"] }
proptest = "1"
mockito = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
